<!doctype html>
<html>
  <head>
    <title>SafeWalkNYC</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  </head>
  <body>
    <div class="header">
      <div class="header-left">
        <h1>SafeWalkNYC</h1>
        <p>Find the safest routes through New York City</p>
      </div>
      <div class="route-info" id="routeInfo">
        <div class="safety-score">
          <span class="safety-badge" id="safetyBadge">Low Risk</span>
          <span class="walking-time" id="walkingTime">12 mins</span>
          <span class="crime-count" id="crimeCount"></span>
        </div>
      </div>
    </div>

    <div id="map"></div>

    <div class="sidebar-panel">
      <div class="control-panel">
        <div class="route-form-intro">
          <h3 class="route-form-title">Find Your Safest Route</h3>
          <p class="route-form-description">
            Enter your start and end locations to find the safest walking route
            in NYC.
          </p>
        </div>
        <div class="input-group">
          <label for="startAddress">Start Location</label>
          <input
            type="text"
            id="startAddress"
            placeholder="e.g., Times Square, NY"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="startSuggestions"
            aria-expanded="false"
          />
          <div
            class="address-suggestions"
            id="startSuggestions"
            role="listbox"
          ></div>
        </div>
        <div class="input-group end-location">
          <label for="endAddress">End Location</label>
          <input
            type="text"
            id="endAddress"
            placeholder="e.g., Central Park, NY"
            autocomplete="off"
            aria-autocomplete="list"
            aria-controls="endSuggestions"
            aria-expanded="false"
          />
          <div
            class="address-suggestions"
            id="endSuggestions"
            role="listbox"
          ></div>
        </div>
        <button class="route-btn" onclick="findRoute()">Find Routes</button>
      </div>

      <div class="navigation-panel">
        <div class="navigation-header">
          <div class="navigation-title">Turn-by-Turn Directions</div>
          <div style="display: flex; gap: 0.5rem; align-items: center">
            <button
              class="collapse-nav"
              aria-label="Collapse directions"
              onclick="toggleNavCollapse()"
            >
              ▾
            </button>
            <button class="close-nav" onclick="resetView()">×</button>
          </div>
        </div>
        <div class="route-selector" id="routeSelector"></div>
        <ul class="navigation-list" id="navigationList"></ul>
      </div>

      <div class="route-legend">
        <div class="route-legend-title">Map Legend</div>
        <div class="route-legend-items">
          <div class="route-legend-item route-legend-route">
            <span class="route-legend-swatch"></span>
            <span>Your Route</span>
          </div>
          <div class="route-legend-item">
            <span class="route-legend-dot"></span>
            <span>Police Stations</span>
          </div>
        </div>
      </div>
    </div>

    <div class="location-status" id="locationStatus">GPS: Active</div>

    <script>
      let map, markers, crimeLayer, policeStationsLayer;
      let userLocationMarker, watchId;
      let navigationSteps = [],
        currentStepIndex = 0;
      let routeCoordinates = [];
      let isNavigating = false; // Track if we're currently navigating a route
      let currentCrimeData = [];
      let allRoutes = []; // Array of processed route data
      let activeRouteIndex = 0; // Current active route index
      let routePolylines = []; // Leaflet polyline references

      function initMap() {
        map = L.map("map").setView([40.7128, -74.006], 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: " OpenStreetMap contributors",
        }).addTo(map);

        markers = L.layerGroup().addTo(map);
        crimeLayer = L.layerGroup().addTo(map);
        policeStationsLayer = L.layerGroup().addTo(map);

        fetchPoliceStations();
        L.control.scale().addTo(map);
      }

      function showMessage(message, type = "info") {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${type}`;
        messageDiv.textContent = message;
        document.body.appendChild(messageDiv);
        setTimeout(() => messageDiv.remove(), 5000);
      }

      async function fetchAddressSuggestions(query, signal) {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}, NYC&format=json&limit=6&bounded=1&viewbox=-74.5,40.4,-73.7,40.9&addressdetails=1`,
          { signal },
        );

        if (!response.ok) throw new Error("Address search failed");

        const results = await response.json();
        const seen = new Set();
        return results.filter((result) => {
          if (!result.display_name || seen.has(result.display_name)) {
            return false;
          }
          seen.add(result.display_name);
          return true;
        });
      }

      function setupAddressAutocomplete(inputId, suggestionsId) {
        const input = document.getElementById(inputId);
        const suggestionsEl = document.getElementById(suggestionsId);
        if (!input || !suggestionsEl) return;

        let suggestions = [];
        let activeIndex = -1;
        let debounceTimer;
        let controller;

        function setMenuVisible(isVisible) {
          suggestionsEl.classList.toggle("active", isVisible);
          input.setAttribute("aria-expanded", String(isVisible));
        }

        function clearSuggestions() {
          suggestions = [];
          activeIndex = -1;
          suggestionsEl.innerHTML = "";
          setMenuVisible(false);
        }

        function renderSuggestions(items) {
          suggestionsEl.innerHTML = "";

          if (!items.length) {
            const empty = document.createElement("div");
            empty.className = "address-suggestion muted";
            empty.textContent = "No NYC addresses found";
            suggestionsEl.appendChild(empty);
            setMenuVisible(true);
            return;
          }

          items.forEach((item, index) => {
            const option = document.createElement("button");
            option.type = "button";
            option.className = "address-suggestion";
            option.id = `${suggestionsId}-option-${index}`;
            option.setAttribute("role", "option");
            option.setAttribute("aria-selected", "false");
            option.textContent = item.display_name;
            option.addEventListener("mousedown", (event) => {
              event.preventDefault();
              selectSuggestion(index);
            });
            suggestionsEl.appendChild(option);
          });

          setMenuVisible(true);
        }

        function updateActiveSuggestion(nextIndex) {
          const options = suggestionsEl.querySelectorAll(".address-suggestion");
          activeIndex = nextIndex;

          options.forEach((option, index) => {
            const isActive = index === activeIndex;
            option.classList.toggle("active", isActive);
            option.setAttribute("aria-selected", String(isActive));
          });

          if (activeIndex >= 0) {
            input.setAttribute(
              "aria-activedescendant",
              `${suggestionsId}-option-${activeIndex}`,
            );
            options[activeIndex]?.scrollIntoView({ block: "nearest" });
          } else {
            input.removeAttribute("aria-activedescendant");
          }
        }

        function selectSuggestion(index) {
          const selected = suggestions[index];
          if (!selected) return;

          input.value = selected.display_name;
          input.dataset.lat = selected.lat;
          input.dataset.lng = selected.lon;
          input.dataset.address = selected.display_name;
          clearSuggestions();
        }

        input.addEventListener("input", () => {
          delete input.dataset.lat;
          delete input.dataset.lng;
          delete input.dataset.address;
          window.clearTimeout(debounceTimer);

          const query = input.value.trim();
          if (query.length < 3) {
            clearSuggestions();
            return;
          }

          debounceTimer = window.setTimeout(async () => {
            controller?.abort();
            controller = new AbortController();

            try {
              suggestions = await fetchAddressSuggestions(
                query,
                controller.signal,
              );
              activeIndex = -1;
              renderSuggestions(suggestions);
            } catch (error) {
              if (error.name !== "AbortError") {
                console.error("Address suggestion error:", error);
                clearSuggestions();
              }
            }
          }, 300);
        });

        input.addEventListener("keydown", (event) => {
          const menuIsOpen = suggestionsEl.classList.contains("active");

          if (event.key === "Enter" && (!menuIsOpen || activeIndex < 0)) {
            findRoute();
            return;
          }

          if (!menuIsOpen || !suggestions.length) return;

          if (event.key === "ArrowDown") {
            event.preventDefault();
            updateActiveSuggestion((activeIndex + 1) % suggestions.length);
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            updateActiveSuggestion(
              activeIndex <= 0 ? suggestions.length - 1 : activeIndex - 1,
            );
          } else if (event.key === "Enter") {
            event.preventDefault();
            selectSuggestion(activeIndex);
          } else if (event.key === "Escape") {
            clearSuggestions();
          }
        });

        input.addEventListener("blur", () => {
          window.setTimeout(clearSuggestions, 120);
        });
      }

      async function fetchPoliceStations() {
        try {
          // Clear existing police station markers
          policeStationsLayer.clearLayers();

          // Sample NYPD precinct locations (in a real app, you would fetch this from an API)
          const stations = [
            { name: "1st Precinct", lat: 40.7169, lng: -74.0086 },
            { name: "5th Precinct", lat: 40.7135, lng: -73.9994 },
            { name: "6th Precinct", lat: 40.7325, lng: -74.0009 },
            { name: "7th Precinct", lat: 40.7117, lng: -73.9778 },
            { name: "10th Precinct", lat: 40.7479, lng: -74.0029 },
            { name: "13th Precinct", lat: 40.7338, lng: -73.9845 },
            { name: "17th Precinct", lat: 40.7407, lng: -73.9805 },
            { name: "19th Precinct", lat: 40.7731, lng: -73.9575 },
            { name: "Midtown South Precinct", lat: 40.7547, lng: -73.9903 },
            { name: "Midtown North Precinct", lat: 40.7642, lng: -73.9805 },
          ];

          stations.forEach((station) => {
            L.marker([station.lat, station.lng], {
              icon: L.divIcon({
                className: "police-station-marker",
                html: '<div class="police-station-dot"></div>',
                iconSize: [20, 20],
                iconAnchor: [8, 8],
              }),
            }).addTo(policeStationsLayer).bindPopup(`
                        <div class="map-popup">
                            <h4 class="map-popup-title police">${station.name}</h4>
                            <div class="map-popup-body">
                                <div>NYPD Precinct</div>
                                <div class="map-popup-action">
                                    <a href="https://www.google.com/maps/dir/?api=1&destination=${station.lat},${station.lng}"
                                       target="_blank"
                                       class="map-popup-link">
                                        Get Directions ↗
                                    </a>
                                </div>
                            </div>
                        </div>
                    `);
          });
        } catch (error) {
          console.error("Error loading police stations:", error);
          showMessage("Could not load police station data", "error");
        }
      }

      function calculateSafetyScore(crimeData, routeCoords) {
        if (!crimeData || crimeData.length === 0)
          return { score: "low", count: 0, riskLevel: 0 };

        let totalRiskScore = 0;
        let nearbyCount = 0;
        const routeBuffer = 0.002; // ~200m buffer for more accurate proximity
        const routeLength = calculateRouteLength(routeCoords);

        crimeData.forEach((crime) => {
          if (!crime.latitude || !crime.longitude) return;
          const crimeLat = parseFloat(crime.latitude);
          const crimeLng = parseFloat(crime.longitude);

          const minDistance = getMinDistanceToRoute(
            crimeLat,
            crimeLng,
            routeCoords,
          );
          if (minDistance > routeBuffer) return;

          nearbyCount++;
          let crimeWeight = 1;
          const crimeType = (crime.ofns_desc || "").toLowerCase();
          const crimeDate = crime.cmplnt_fr_dt
            ? new Date(crime.cmplnt_fr_dt)
            : null;

          // Crime severity weights
          if (crimeType.includes("murder") || crimeType.includes("homicide"))
            crimeWeight = 10;
          else if (crimeType.includes("rape") || crimeType.includes("sexual"))
            crimeWeight = 8;
          else if (
            crimeType.includes("assault") ||
            crimeType.includes("robbery")
          )
            crimeWeight = 6;
          else if (
            crimeType.includes("burglary") ||
            crimeType.includes("theft") ||
            crimeType.includes("larceny")
          )
            crimeWeight = 3;
          else if (crimeType.includes("drug") || crimeType.includes("weapon"))
            crimeWeight = 4;
          else crimeWeight = 1;

          // Recency multiplier (more recent crimes are weighted higher)
          if (crimeDate) {
            const daysSince =
              (Date.now() - crimeDate.getTime()) / (1000 * 60 * 60 * 24);
            if (daysSince <= 30) crimeWeight *= 2.0;
            else if (daysSince <= 90) crimeWeight *= 1.5;
            else if (daysSince <= 180) crimeWeight *= 1.2;
          }

          // Distance decay (closer crimes weighted more heavily)
          const distanceDecay = Math.max(0.1, 1 - minDistance / routeBuffer);
          totalRiskScore += crimeWeight * distanceDecay;
        });

        // Normalize by route length (crimes per km)
        const riskDensity =
          routeLength > 0 ? totalRiskScore / routeLength : totalRiskScore;

        // Determine risk level based on comprehensive scoring
        let riskLevel;
        if (riskDensity >= 15 || nearbyCount >= 20) riskLevel = "high";
        else if (riskDensity >= 8 || nearbyCount >= 12) riskLevel = "medium";
        else riskLevel = "low";

        return {
          score: riskLevel,
          count: nearbyCount,
          riskScore: Math.round(totalRiskScore),
          density: Math.round(riskDensity * 10) / 10,
        };
      }

      function getMinDistanceToRoute(lat, lng, routeCoords) {
        let minDistance = Infinity;
        for (let i = 0; i < routeCoords.length - 1; i++) {
          const distance = distanceToLineSegment(
            lat,
            lng,
            routeCoords[i],
            routeCoords[i + 1],
          );
          minDistance = Math.min(minDistance, distance);
        }
        return minDistance;
      }

      function distanceToLineSegment(px, py, [ax, ay], [bx, by]) {
        const A = px - ax,
          B = py - ay,
          C = bx - ax,
          D = by - ay;
        const dot = A * C + B * D,
          lenSq = C * C + D * D;
        let param = lenSq !== 0 ? dot / lenSq : -1;
        let xx, yy;
        if (param < 0) [xx, yy] = [ax, ay];
        else if (param > 1) [xx, yy] = [bx, by];
        else [xx, yy] = [ax + param * C, ay + param * D];
        const dx = px - xx,
          dy = py - yy;
        return Math.sqrt(dx * dx + dy * dy);
      }

      function calculateRouteLength(routeCoords) {
        let length = 0;
        for (let i = 0; i < routeCoords.length - 1; i++) {
          length += getDistance(
            routeCoords[i][0],
            routeCoords[i][1],
            routeCoords[i + 1][0],
            routeCoords[i + 1][1],
          );
        }
        return length / 1000; // Convert to km
      }

      function updateRouteInfo(routeData, safetyData) {
        const routeInfo = document.getElementById("routeInfo");
        const safetyBadge = document.getElementById("safetyBadge");
        const walkingTime = document.getElementById("walkingTime");
        const crimeCount = document.getElementById("crimeCount");

        // Update safety score
        safetyBadge.className = `safety-badge ${safetyData.score}`;
        switch (safetyData.score) {
          case "high":
            safetyBadge.textContent = "High Risk";
            break;
          case "medium":
            safetyBadge.textContent = "Medium Risk";
            break;
          default:
            safetyBadge.textContent = "Low Risk";
            break;
        }

        // Calculate accurate walking time (average walking speed: 5 km/h)
        const distanceKm = routeData.distance / 1000;
        const walkingSpeedKmh = 5;
        const walkingTimeMinutes = Math.round(
          (distanceKm / walkingSpeedKmh) * 60,
        );
        walkingTime.textContent = `${walkingTimeMinutes} min walk`;

        // Display crime statistics
        crimeCount.textContent = `${safetyData.count} incidents nearby`;

        routeInfo.classList.add("active");
      }

      function selectRoute(index, fitRouteBounds = true) {
        if (index < 0 || index >= allRoutes.length) return;
        activeRouteIndex = index;

        const selected = allRoutes[index];
        routeCoordinates = selected.coords;
        navigationSteps = selected.route.legs[0].steps;
        currentStepIndex = 0;

        // Update map polyline styles
        routePolylines.forEach((polyline, idx) => {
          const isActive = idx === index;
          polyline.setStyle({
            color: isActive ? "#2563eb" : "#25c6ea",
            weight: isActive ? 7 : 7,
            opacity: isActive ? 0.95 : 0.75,
          });
          if (isActive) {
            polyline.bringToFront();
          }
        });

        // Update navigation steps list
        displayNavigationInstructions(navigationSteps);

        // Update top route info card
        updateRouteInfo(selected.route, selected.safetyData);

        // Update active state in selector UI
        const cards = document.querySelectorAll(".route-card");
        cards.forEach((card, idx) => {
          if (idx === index) {
            card.classList.add("active");
          } else {
            card.classList.remove("active");
          }
        });

        // Fit bounds to selected route if requested
        if (fitRouteBounds) {
          const selectedPolyline = routePolylines[index];
          if (selectedPolyline) {
            const routePadding = getRouteBoundsPadding();
            map.fitBounds(selectedPolyline.getBounds(), {
              paddingTopLeft: routePadding.topLeft,
              paddingBottomRight: routePadding.bottomRight,
            });
          }
        }
      }

      function getRouteBoundsPadding() {
        const sidebarIsVisible =
          window.matchMedia("(min-width: 768px)").matches;
        const sidebar = document.querySelector(".sidebar-panel");
        const sidebarBounds = sidebar?.getBoundingClientRect();
        const leftPadding = sidebarBounds
          ? Math.ceil(sidebarBounds.right + 40)
          : 460;

        return sidebarIsVisible
          ? { topLeft: [leftPadding, 90], bottomRight: [70, 70] }
          : { topLeft: [50, 50], bottomRight: [50, 50] };
      }

      function renderRouteSelector() {
        const selectorContainer = document.getElementById("routeSelector");
        if (!selectorContainer) return;
        selectorContainer.innerHTML = "";

        // Find the safest route index
        let safestIndex = 0;
        let minRisk = Infinity;
        allRoutes.forEach((r, idx) => {
          if (r.safetyData.riskScore < minRisk) {
            minRisk = r.safetyData.riskScore;
            safestIndex = idx;
          }
        });

        allRoutes.forEach((routeObj, idx) => {
          const distanceKm = routeObj.route.distance / 1000;
          const walkingSpeedKmh = 5;
          const durationMin = Math.round((distanceKm / walkingSpeedKmh) * 60);

          let badgeHtml = "";
          if (idx === safestIndex) {
            badgeHtml = '<span class="route-card-badge low">Safest</span>';
          } else if (idx === 0) {
            badgeHtml = '<span class="route-card-badge fastest">Fastest</span>';
          }

          const card = document.createElement("div");
          card.className = `route-card ${idx === activeRouteIndex ? "active" : ""}`;
          card.onclick = () => selectRoute(idx);
          card.innerHTML = `
                    <div class="route-card-title">
                        <span>Route ${idx + 1}</span>
                        ${badgeHtml}
                    </div>
                    <div class="route-card-meta">
                        ${durationMin} min | ${(distanceKm * 0.621371).toFixed(1)} mi
                    </div>
                    <div class="route-card-safety">
                        <span class="route-card-badge ${routeObj.safetyData.score}">${routeObj.safetyData.score} risk</span>
                        <span class="route-card-crimes">(${routeObj.safetyData.count} crimes)</span>
                    </div>
                `;
          selectorContainer.appendChild(card);
        });
      }

      function setRouteLegendHasRoute(hasRoute) {
        document
          .querySelector(".route-legend")
          ?.classList.toggle("has-route", hasRoute);
      }

      function resetView() {
        // Stop location tracking
        stopLocationTracking();

        // Clear route lines and markers
        markers.clearLayers();
        routePolylines.forEach((p) => map.removeLayer(p));
        routePolylines = [];
        allRoutes = [];
        setRouteLegendHasRoute(false);

        // Hide navigation panel and reset collapsed state
        const navPanel = document.querySelector(".navigation-panel");
        navPanel.classList.remove("active");
        navPanel.classList.remove("collapsed");

        // Show control panel
        document.querySelector(".control-panel").classList.remove("hidden");

        // Hide route info
        document.getElementById("routeInfo").classList.remove("active");

        // Reset map view to default
        map.setView([40.7128, -74.006], 13);
      }

      // Add loading state management
      let isLoading = false;

      async function findRoute() {
        if (isLoading) return;

        const startInput = document.getElementById("startAddress");
        const endInput = document.getElementById("endAddress");

        if (!startInput.value || !endInput.value) {
          showMessage("Please enter both start and end locations", "error");
          return;
        }

        // Show loading state
        isLoading = true;
        const loading = document.createElement("div");
        loading.className = "loading";
        loading.innerHTML =
          '<div class="spinner"></div><p>Calculating safest route...</p>';
        document.body.appendChild(loading);

        try {
          // Clear previous route and markers, but keep the crime data layer
          markers.clearLayers();

          // Only clear crime layer if we're not in the middle of a navigation
          if (!isNavigating) {
            crimeLayer.clearLayers();
          }

          // Get coordinates for start and end points
          const [startCoords, endCoords] = await Promise.all([
            getCoordinatesFromInput(startInput),
            getCoordinatesFromInput(endInput),
          ]);

          // Fetch route from OSRM
          const routeResponse = await fetch(
            `https://router.project-osrm.org/route/v1/foot/${startCoords.lng},${startCoords.lat};${endCoords.lng},${endCoords.lat}?steps=true&geometries=geojson&overview=full&alternatives=true`,
          );

          if (!routeResponse.ok) throw new Error("Route calculation failed");

          const routeData = await routeResponse.json();
          if (!routeData.routes || routeData.routes.length === 0)
            throw new Error("No routes found");

          const routes = routeData.routes.slice(0, 5);

          // Combine coordinates to get the full bounding box for crime search
          const allCoords = routes.flatMap((r) => r.geometry.coordinates);
          const crimes = await visualizeCrimeData(allCoords);

          // Process all routes with crime scores
          allRoutes = routes.map((route, idx) => {
            const coords = route.geometry.coordinates.map((coord) => [
              coord[1],
              coord[0],
            ]);
            const safetyData = calculateSafetyScore(crimes, coords);
            return { route, coords, safetyData, index: idx };
          });

          // Clear previous route polylines
          routePolylines.forEach((p) => map.removeLayer(p));
          routePolylines = [];
          setRouteLegendHasRoute(false);

          // Draw all routes
          allRoutes.forEach((rObj) => {
            const polyline = L.polyline(rObj.coords, {
              color: rObj.index === 0 ? "#2563eb" : "#94a3b8",
              weight: rObj.index === 0 ? 7 : 4,
              opacity: rObj.index === 0 ? 0.95 : 0.5,
              smoothFactor: 1,
              interactive: true,
            }).addTo(markers);

            polyline.on("click", () => selectRoute(rObj.index));
            routePolylines.push(polyline);
          });
          setRouteLegendHasRoute(routePolylines.length > 0);

          // Add start and end markers
          L.marker([startCoords.lat, startCoords.lng], {
            icon: L.divIcon({
              className: "start-marker",
              html: '<div class="route-start-dot"></div>',
              iconSize: [20, 20],
              iconAnchor: [10, 10],
            }),
          }).addTo(markers);

          L.marker([endCoords.lat, endCoords.lng], {
            icon: L.divIcon({
              className: "end-marker",
              html: '<div class="route-end-dot"></div>',
              iconSize: [20, 20],
              iconAnchor: [10, 10],
            }),
          }).addTo(markers);

          // Render route selector in the panel
          renderRouteSelector();

          // Select the first route by default, but don't fit individual bounds yet
          selectRoute(0, false);

          // Fit bounds to show all routes overlaid on the map
          if (routePolylines.length > 0) {
            const group = L.featureGroup(routePolylines);
            const routePadding = getRouteBoundsPadding();
            map.fitBounds(group.getBounds(), {
              paddingTopLeft: routePadding.topLeft,
              paddingBottomRight: routePadding.bottomRight,
            });
          }

          // Update UI
          document.querySelector(".control-panel").classList.add("hidden");
          const nav = document.querySelector(".navigation-panel");
          nav.classList.add("active");
          // ensure expanded when first shown
          nav.classList.remove("collapsed");

          // Start tracking user's location
          isNavigating = true;
          startLocationTracking();

          showMessage("Route calculated! Starting navigation...", "success");
        } catch (error) {
          console.error("Route finding error:", error);
          let errorMessage = "Error finding route. Please try again.";

          if (error.message.includes("Failed to fetch")) {
            errorMessage = "Network error. Please check your connection.";
          } else if (error.message.includes("No routes found")) {
            errorMessage =
              "No route found. Try adjusting your start or end point.";
          } else if (error.message.includes("Location not found")) {
            errorMessage =
              "Location not found. Please check the addresses and try again.";
          }

          showMessage(errorMessage, "error");
        } finally {
          // Clean up loading state
          isLoading = false;
          if (document.body.contains(loading)) {
            loading.remove();
          }
        }
      }

      function displayNavigationInstructions(steps) {
        const navigationList = document.getElementById("navigationList");
        navigationList.innerHTML = "";

        steps.forEach((step, index) => {
          const li = document.createElement("li");
          li.className = "navigation-item";
          if (index === 0) li.classList.add("current");

          const instruction =
            step.maneuver.instruction || getInstructionText(step.maneuver);
          const distance =
            step.distance > 1000
              ? `${(step.distance / 1609.34).toFixed(1)} mi`
              : `${Math.round(step.distance * 3.28084)} ft`;

          li.innerHTML = `
                    <div class="navigation-icon">${index + 1}</div>
                    <div class="navigation-text">
                        <div class="navigation-instruction">${instruction}</div>
                        <div class="navigation-distance">${distance}</div>
                    </div>
                `;

          navigationList.appendChild(li);
        });
      }

      function getInstructionText(maneuver) {
        const type = maneuver.type;
        const modifier = maneuver.modifier;

        switch (type) {
          case "depart":
            return "Head " + (modifier || "straight");
          case "turn":
            return "Turn " + (modifier || "right");
          case "new name":
            return "Continue straight";
          case "arrive":
            return "You have arrived at your destination";
          case "merge":
            return "Merge " + (modifier || "right");
          case "continue":
            return "Continue straight";
          default:
            return "Continue " + (modifier || "straight");
        }
      }

      function startLocationTracking() {
        if (!navigator.geolocation) {
          showMessage("Geolocation not supported", "error");
          return;
        }

        document.getElementById("locationStatus").classList.add("active");

        watchId = navigator.geolocation.watchPosition(
          updateUserLocation,
          (error) => {
            console.error("Location error:", error);
            showMessage("Location tracking unavailable", "error");
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 },
        );
      }

      function updateUserLocation(position) {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        if (userLocationMarker) {
          userLocationMarker.setLatLng([userLat, userLng]);
        } else {
          userLocationMarker = L.marker([userLat, userLng], {
            icon: L.divIcon({
              className: "user-location-marker",
              html: '<div class="user-location"></div>',
            }),
          }).addTo(markers);
        }

        checkNavigationProgress(userLat, userLng);
      }

      function checkNavigationProgress(userLat, userLng) {
        if (currentStepIndex >= navigationSteps.length) return;

        const currentStep = navigationSteps[currentStepIndex];
        if (!currentStep.maneuver || !currentStep.maneuver.location) return;

        const stepLat = currentStep.maneuver.location[1];
        const stepLng = currentStep.maneuver.location[0];

        const distance = getDistance(userLat, userLng, stepLat, stepLng);

        if (distance < 30) {
          completeCurrentStep();
        }
      }

      function completeCurrentStep() {
        const navigationItems = document.querySelectorAll(".navigation-item");
        if (navigationItems[currentStepIndex]) {
          navigationItems[currentStepIndex].classList.remove("current");
          navigationItems[currentStepIndex].classList.add("completed");
        }

        currentStepIndex++;

        if (currentStepIndex < navigationSteps.length) {
          if (navigationItems[currentStepIndex]) {
            navigationItems[currentStepIndex].classList.add("current");
            navigationItems[currentStepIndex].scrollIntoView({
              behavior: "smooth",
              block: "center",
            });
          }
        } else {
          showMessage("You have arrived at your destination!", "success");
          stopLocationTracking();
        }
      }

      function getDistance(lat1, lng1, lat2, lng2) {
        const R = 6371e3;
        const φ1 = (lat1 * Math.PI) / 180;
        const φ2 = (lat2 * Math.PI) / 180;
        const Δφ = ((lat2 - lat1) * Math.PI) / 180;
        const Δλ = ((lng2 - lng1) * Math.PI) / 180;

        const a =
          Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
          Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
      }

      function stopLocationTracking() {
        if (watchId) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }
        if (userLocationMarker) {
          map.removeLayer(userLocationMarker);
          userLocationMarker = null;
        }
        document.getElementById("locationStatus").classList.remove("active");
        isNavigating = false;
      }

      function getCoordinatesFromInput(input) {
        const lat = parseFloat(input.dataset.lat);
        const lng = parseFloat(input.dataset.lng);

        if (
          input.dataset.address === input.value &&
          Number.isFinite(lat) &&
          Number.isFinite(lng)
        ) {
          return { lat, lng };
        }

        return getCoordinates(input.value);
      }

      async function getCoordinates(address) {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}, NYC&format=json&limit=1&bounded=1&viewbox=-74.5,40.4,-73.7,40.9`,
        );

        if (!response.ok) throw new Error("Geocoding failed");
        const data = await response.json();
        if (!data || data.length === 0) throw new Error("Location not found");

        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }

      async function visualizeCrimeData(coordinates) {
        try {
          crimeLayer.clearLayers();

          // Calculate bounding box around the route
          const lats = coordinates.map((coord) => coord[1]);
          const lngs = coordinates.map((coord) => coord[0]);
          const minLat = Math.min(...lats) - 0.01;
          const maxLat = Math.max(...lats) + 0.01;
          const minLng = Math.min(...lngs) - 0.01;
          const maxLng = Math.max(...lngs) + 0.01;

          // Load crime data from NYC Open Data (try local proxy first, fallback to direct SODA API)
          let crimes = [];
          let fetchSuccess = false;

          try {
            const localUrl = `http://localhost:3001/api/nyc-crime/area?north=${maxLat}&south=${minLat}&east=${maxLng}&west=${minLng}`;
            const proxyResponse = await fetch(localUrl);
            if (proxyResponse.ok) {
              const result = await proxyResponse.json();
              if (result.success && result.data) {
                crimes = result.data.map((c) => ({
                  latitude: c.lat,
                  longitude: c.lng,
                  ofns_desc: c.type,
                  pd_desc: c.type,
                  cmplnt_fr_dt: c.date,
                  severity: c.severity,
                }));
                fetchSuccess = true;
                console.log(`Fetched ${crimes.length} crimes from local proxy`);
              }
            }
          } catch (e) {
            console.log(
              "Local proxy fetch failed, falling back to direct SODA API:",
              e,
            );
          }

          if (!fetchSuccess) {
            const crimeUrl = `https://data.cityofnewyork.us/resource/qgea-i56i.json?$where=latitude IS NOT NULL AND longitude IS NOT NULL AND latitude BETWEEN ${minLat} AND ${maxLat} AND longitude BETWEEN ${minLng} AND ${maxLng}&$limit=200&$order=cmplnt_fr_dt DESC`;
            const response = await fetch(crimeUrl);
            if (!response.ok)
              throw new Error("Failed to fetch crime data from direct API");
            crimes = await response.json();
            console.log(`Fetched ${crimes.length} crimes from direct SODA API`);
          }
          if (!crimes || !crimes.length) {
            // Fallback to sample data if no crimes found
            crimes = generateSampleCrimes(coordinates);
          }

          // Process and display crime data
          crimes.forEach((crime) => {
            if (!crime.latitude || !crime.longitude) return;

            const crimeLat = parseFloat(crime.latitude);
            const crimeLng = parseFloat(crime.longitude);

            if (isNaN(crimeLat) || isNaN(crimeLng)) return;

            const crimeType = (crime.ofns_desc || "").toLowerCase();
            let color = "#f59e0b"; // Default to medium risk (yellow)
            let severity = "medium";

            // Categorize crime types
            if (
              crimeType.includes("assault") ||
              crimeType.includes("robbery") ||
              crimeType.includes("rape") ||
              crimeType.includes("murder")
            ) {
              color = "#ef4444"; // High risk (red)
              severity = "high";
            } else if (
              crimeType.includes("theft") ||
              crimeType.includes("burglary") ||
              crimeType.includes("larceny")
            ) {
              color = "#f59e0b"; // Medium risk (yellow)
              severity = "medium";
            } else {
              color = "#eab308"; // Low risk (orange)
              severity = "low";
            }

            // Create a marker for the crime
            const marker = L.circleMarker([crimeLat, crimeLng], {
              radius: 6,
              fillColor: color,
              color: "#fff",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.8,
            }).addTo(crimeLayer);

            // Add popup with crime details
            const crimeDate = crime.cmplnt_fr_dt
              ? new Date(crime.cmplnt_fr_dt).toLocaleDateString()
              : "Unknown date";
            marker.bindPopup(`
                        <div class="map-popup">
                            <h4 class="map-popup-title">${crime.ofns_desc || "Crime Report"}</h4>
                            <div class="map-popup-body with-spacing">
                                <div><strong>Type:</strong> ${crime.pd_desc || "N/A"}</div>
                                <div><strong>Date:</strong> ${crimeDate}</div>
                                <div><strong>Severity:</strong> <span class="severity-label ${severity}">${severity.charAt(0).toUpperCase() + severity.slice(1)}</span></div>
                            </div>
                        </div>
                    `);
          });

          // Return processed crime data for safety scoring
          return crimes;
        } catch (error) {
          console.error("Error visualizing crime data:", error);
          showMessage(
            "Error loading crime data. Using sample data instead.",
            "error",
          );
          return [];
        }
      }

      // Generate sample crime data as fallback
      function generateSampleCrimes(coordinates) {
        const sampleCrimes = [];
        const crimeTypes = [
          { ofns_desc: "Petit Larceny", pd_desc: "THEFT OF SERVICES" },
          { ofns_desc: "Assault", pd_desc: "ASSAULT 3" },
          { ofns_desc: "Criminal Mischief", pd_desc: "CRIMINAL MISCHIEF" },
          { ofns_desc: "Robbery", pd_desc: "ROBBERY" },
          { ofns_desc: "Burglary", pd_desc: "BURGLARY" },
          { ofns_desc: "Grand Larceny", pd_desc: "GRAND LARCENY" },
          { ofns_desc: "Harassment", pd_desc: "HARASSMENT" },
          { ofns_desc: "Criminal Trespass", pd_desc: "CRIMINAL TRESPASS" },
          {
            ofns_desc: "Drug Possession",
            pd_desc: "CRIMINAL POSSESSION OF CONTROLLED SUBSTANCE",
          },
          {
            ofns_desc: "Weapon Possession",
            pd_desc: "CRIMINAL POSSESSION OF WEAPON",
          },
        ];

        // Generate 20-30 sample crimes along the route
        const numCrimes = 20 + Math.floor(Math.random() * 11);

        for (let i = 0; i < numCrimes; i++) {
          // Distribute crimes along the route
          const routePos = Math.random();
          const routeIndex = Math.min(
            Math.floor(routePos * coordinates.length),
            coordinates.length - 1,
          );

          const [lng, lat] = coordinates[routeIndex];
          const crimeType =
            crimeTypes[Math.floor(Math.random() * crimeTypes.length)];

          // Add some random offset to spread out the markers
          const offsetLat = Math.random() * 0.01 - 0.005;
          const offsetLng = Math.random() * 0.01 - 0.005;

          sampleCrimes.push({
            latitude: lat + offsetLat,
            longitude: lng + offsetLng,
            ofns_desc: crimeType.ofns_desc,
            pd_desc: crimeType.pd_desc,
            cmplnt_fr_dt: new Date(
              Date.now() - Math.floor(Math.random() * 30 * 24 * 60 * 60 * 1000),
            ).toISOString(),
          });
        }

        return sampleCrimes;
      }

      // Initialize the map when the page loads
      document.addEventListener("DOMContentLoaded", function () {
        // Initialize the map
        if (typeof L !== "undefined") {
          initMap();

          // Add click handler for the close navigation button
          document
            .querySelector(".close-nav")
            ?.addEventListener("click", resetView);

          // Add click handler for the route button
          document
            .querySelector(".route-btn")
            ?.addEventListener("click", findRoute);

          setupAddressAutocomplete("startAddress", "startSuggestions");
          setupAddressAutocomplete("endAddress", "endSuggestions");

          // Show initial message
          setTimeout(() => {
            showMessage(
              "Enter your start and end locations to find the safest route",
              "info",
            );
          }, 1000);
        } else {
          console.error("Leaflet library failed to load");
          showMessage(
            "Error: Map functionality not available. Please try refreshing the page.",
            "error",
          );
        }
      });

      // Expose functions to the global scope for HTML event handlers
      window.findRoute = findRoute;
      window.resetView = resetView;
      function toggleNavCollapse() {
        const nav = document.querySelector(".navigation-panel");
        if (!nav) return;
        const btn = document.querySelector(".collapse-nav");
        const isCollapsed = nav.classList.toggle("collapsed");
        if (btn) btn.textContent = isCollapsed ? "▴" : "▾";
      }
      window.toggleNavCollapse = toggleNavCollapse;
    </script>
  </body>
</html>
