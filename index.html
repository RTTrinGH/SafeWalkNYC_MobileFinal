          const minLat = Math.min(...lats) - 0.01;
          const maxLat = Math.max(...lats) + 0.01;
          const minLng = Math.min(...lngs) - 0.01;
          const maxLng = Math.max(...lngs) + 0.01;

          // Load crime data from NYC Open Data (try local proxy first, fallback to direct SODA API)
          let crimes = [];
          let fetchSuccess = false;

          try {
            // Same origin, whatever port or host this is served from. The
            // old hardcoded localhost:3001 meant the proxy was silently
            // skipped anywhere else, quietly falling back to the slower,
            // uncached direct API.
            const localUrl = `/api/nyc-crime/area?north=${maxLat}&south=${minLat}&east=${maxLng}&west=${minLng}`;
            const proxyResponse = await fetch(localUrl);
            if (proxyResponse.ok) {
              const result = await proxyResponse.json();
              if (result.success && result.data) {
                // Keep every field the safety model weighs on. The hour of
                // day and whether it happened indoors were previously fetched
                // and then dropped here, which is most of what makes a score
                // mean anything.
                crimes = result.data.map((c) => ({
                  latitude: c.lat,
                  longitude: c.lng,
                  ofns_desc: c.type,
                  pd_desc: c.detail || c.type,
                  cmplnt_fr_dt: c.date,
                  cmplnt_fr_tm: c.time,
                  lawCat: c.lawCat,
                  where: c.where,
                  premises: c.premises,
                  completed: c.completed,
                  severity: c.severity,
                }));
                if (Number.isFinite(result.referenceMs)) {
                  crimeReferenceMs = result.referenceMs;
                }
                if (Number.isFinite(result.windowDays)) {
                  crimeWindowDays = result.windowDays;
                }
                fetchSuccess = true;
                console.log(`Fetched ${crimes.length} crimes from local proxy`);
              }
            }
          } catch (e) {
            console.log(
              "Local proxy fetch failed, falling back to direct SODA API:",
              e,
            );
          }

          if (!fetchSuccess) {
            const window = await directWindow();
            crimeReferenceMs = window.referenceMs;
            crimeWindowDays = window.windowDays;
            const params = new URLSearchParams({
              $select:
                "ofns_desc,pd_desc,law_cat_cd,cmplnt_fr_dt,cmplnt_fr_tm," +
                "latitude,longitude,loc_of_occur_desc,prem_typ_desc,crm_atpt_cptd_cd",
              $where:
                `latitude between ${minLat} and ${maxLat}` +
                ` and longitude between ${minLng} and ${maxLng}` +
                ` and cmplnt_fr_dt >= '${window.since}T00:00:00'`,
              $limit: "3000",
              $order: "cmplnt_fr_dt DESC",
            });
            const response = await fetch(
              `https://data.cityofnewyork.us/resource/5uac-w243.json?${params}`,
            );
            if (!response.ok)
              throw new Error("Failed to fetch crime data from direct API");
            crimes = (await response.json()).map((c) => ({
              ...c,
              lawCat: c.law_cat_cd,
              where: c.loc_of_occur_desc,
              premises: c.prem_typ_desc,
              completed: c.crm_atpt_cptd_cd,
            }));
            console.log(`Fetched ${crimes.length} crimes from direct SODA API`);
          }

          /*
           * If the feed gives us nothing, say so. The previous behaviour was
           * to invent plausible incidents and plot them as if they were real,
           * which is the one thing a safety app must never do.
           */
          crimeDataAvailable = Boolean(crimes && crimes.length);
          if (!crimeDataAvailable) {
            showMessage(
              "No incident data available right now, so routes are not scored.",
              "error",
            );
            return [];
          }

          // Plot only what sits along the corridor being walked, most
          // serious first, so the map stays readable at any zoom.
          const corridor = coordinates.map((coord) => [coord[1], coord[0]]);
          let plotted = 0;
          const plottable = crimes
            .filter((crime) => {
              const lat = parseFloat(crime.latitude);
              const lng = parseFloat(crime.longitude);
              if (isNaN(lat) || isNaN(lng)) return false;
              return getMinDistanceToRoute(lat, lng, corridor) < 0.0025;
            })
            .sort(
              (a, b) => offenceWeight(b.ofns_desc) - offenceWeight(a.ofns_desc),
            );

          plottable.forEach((crime) => {
            if (plotted >= 300) return;
            plotted++;

            const crimeLat = parseFloat(crime.latitude);
            const crimeLng = parseFloat(crime.longitude);

            const crimeType = (crime.ofns_desc || "").toLowerCase();
            let color = "#ef8a1a"; // Default to medium risk
            let severity = "medium";

            // Categorize crime types
            if (
              crimeType.includes("assault") ||
              crimeType.includes("robbery") ||
              crimeType.includes("rape") ||
              crimeType.includes("murder")
            ) {
              color = "#d93a30"; // High risk
              severity = "high";
            } else if (
              crimeType.includes("theft") ||
              crimeType.includes("burglary") ||
              crimeType.includes("larceny")
            ) {
              color = "#ef8a1a"; // Medium risk
              severity = "medium";
            } else {
              color = "#e0b429"; // Low risk
              severity = "low";
            }

            // Create a marker for the crime
            const marker = L.circleMarker([crimeLat, crimeLng], {
              radius: 4,
              fillColor: color,
              color: "#fff",
              weight: 1.2,
              opacity: 0.9,
              fillOpacity: 0.75,
            }).addTo(crimeLayer);

            // Add popup with crime details
            const crimeDate = crime.cmplnt_fr_dt
              ? new Date(crime.cmplnt_fr_dt).toLocaleDateString()
              : "Unknown date";
            marker.bindPopup(`
                        <div class="map-popup">
                            <h4 class="map-popup-title">${crime.ofns_desc || "Crime Report"}</h4>
                            <div class="map-popup-body with-spacing">
                                <div><strong>Type:</strong> ${crime.pd_desc || "N/A"}</div>
                                <div><strong>Date:</strong> ${crimeDate}</div>
                                <div><strong>Severity:</strong> <span class="severity-label ${severity}">${severity.charAt(0).toUpperCase() + severity.slice(1)}</span></div>
                            </div>
                        </div>
                    `);
          });

          // Return processed crime data for safety scoring
          return crimes;
        } catch (error) {
          console.error("Error visualizing crime data:", error);
          crimeDataAvailable = false;
          showMessage(
            "Couldn't reach the incident feed, so routes aren't scored right now.",
            "error",
          );
          return [];
        }
      }

      /* =====================================================================
       * Getting going, and getting help
       * ===================================================================== */

      // Typing out where you are standing is silly on a phone.
      async function useMyLocation() {
        const input = document.getElementById("startAddress");
        if (!navigator.geolocation || !input) {
          showMessage("Your browser will not share a location.", "error");
          return;
        }

        const button = document.querySelector(".locate-btn");
        button?.classList.add("busy");
        input.placeholder = "Finding you...";

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const { latitude, longitude } = position.coords;
            input.dataset.lat = latitude;
            input.dataset.lng = longitude;
            input.value = "My location";
            input.dataset.address = input.value;

            try {
              const response = await fetch(
                "https://nominatim.openstreetmap.org/reverse?format=json" +
                  `&lat=${latitude}&lon=${longitude}&zoom=18`,
              );
              if (response.ok) {
                const place = await response.json();
                if (place.display_name) {
                  input.value = place.display_name
                    .split(",")
                    .slice(0, 3)
                    .join(",");
                  input.dataset.address = input.value;
                }
              }
            } catch (error) {
              // The coordinates are what matter; the name is a nicety.
              console.warn("Could not name your location:", error);
            }

            button?.classList.remove("busy");
            input.placeholder = "Times Square";
            map.setView([latitude, longitude], 15);
          },
          (error) => {
            console.warn("Geolocation failed:", error);
            button?.classList.remove("busy");
            input.placeholder = "Times Square";
            showMessage(
              "Could not get your location. Check location permissions.",
              "error",
            );
          },
          { enableHighAccuracy: true, timeout: 10000 },
        );
      }

      // Point me at the nearest place that is open and staffed, right now.
      async function goToNearestHaven() {
        await loadSafeHavens();
        if (!safeHavens.length) {
          showMessage("Safe place list is not loaded.", "error");
          return;
        }

        const from = userLocationMarker
          ? userLocationMarker.getLatLng()
          : map.getCenter();
        const found = nearestHaven(from.lat, from.lng);
        if (!found) return;

        const kind = HAVEN_KINDS[found.haven.t] || HAVEN_KINDS.police;
        const minutes = Math.max(1, walkMinutes(found.distance));
        map.setView([found.haven.y, found.haven.x], 17);
        havenMarker(found.haven).addTo(havenLayer).openPopup();
        showMessage(
          `${kind.label}: ${found.haven.n}, about ${minutes} min away.`,
          "success",
        );
      }

      // Tell someone where you are going and when you should be there.
      async function shareWalk() {
        const destination =
          document.getElementById("endAddress")?.value || "my destination";
        const active = allRoutes[activeRouteIndex];
        const minutes = active ? routeMinutes(active.route) : null;

        const text = minutes
          ? `Walking to ${destination}. Should arrive about ${arrivalTime(minutes)}.`
          : `Walking to ${destination}.`;

        try {
          if (navigator.share) {
            await navigator.share({ title: "My walk", text });
            return;
          }
          await navigator.clipboard.writeText(text);
          showMessage("Copied, ready to send to someone.", "success");
        } catch (error) {
          if (error && error.name === "AbortError") return;
          showMessage(text, "info");
        }
      }

      /* --- Night mode ------------------------------------------------------
       * Most of these walks happen after dark, and a page this bright is
       * genuinely unpleasant at that hour. Follows the clock unless you say
       * otherwise.
       */
      function applyTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        const button = document.querySelector(".theme-btn");
        if (button) {
          button.setAttribute(
            "aria-label",
            theme === "dark" ? "Switch to day colours" : "Switch to night colours",
          );
          button.setAttribute("aria-pressed", String(theme === "dark"));
        }
      }

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") || "light";
      }

      function toggleTheme() {
        const next = currentTheme() === "dark" ? "light" : "dark";
        applyTheme(next);
        try {
          localStorage.setItem("safewalk-theme", next);
        } catch (error) {
          // Private browsing; the choice just will not persist.
        }
      }

      function initTheme() {
        let saved = null;
        try {
          saved = localStorage.getItem("safewalk-theme");
        } catch (error) {
          saved = null;
        }
        applyTheme(saved || (isAfterDark(new Date().getHours()) ? "dark" : "light"));
      }

      /* --- Departure time -------------------------------------------------- */

      function setDeparture(choice) {
        departureChoice = choice;

        document.querySelectorAll(".when-chip").forEach((chip) => {
          const active = chip.dataset.when === choice;
          chip.classList.toggle("active", active);
          chip.setAttribute("aria-pressed", String(active));
        });

        const custom = document.getElementById("customTime");
        const isCustom = choice !== "now" && choice !== "night";
        // Keep the visible clock and the hour we score with in step.
        if (isCustom && custom && custom.value !== choice) custom.value = choice;
        document
          .querySelector(".when-chip[data-when='custom']")
          ?.classList.toggle("active", isCustom);
        if (custom) custom.hidden = !isCustom;

        updateDepartureHint();

        // Re-score what is already on screen against the new hour.
        if (allRoutes.length && currentCrimeData.length) {
          allRoutes.forEach((entry) => {
            entry.safetyData = calculateSafetyScore(
              currentCrimeData,
              entry.coords,
              departureHour(),
            );
          });
          renderRouteSelector();
          const active = allRoutes[activeRouteIndex];
          if (active) updateRouteInfo(active.route, active.safetyData);
        }
      }

      function updateDepartureHint() {
        const hint = document.getElementById("whenHint");
        if (!hint) return;
        const when = departureDate();
        const hour = when.getHours();
        hint.textContent = isAfterDark(hour)
          ? `Scored for ${formatClock(when)} — after dark, fewer people about`
          : `Scored for a walk at ${formatClock(when)}`;
      }

      // Initialize the map when the page loads
      document.addEventListener("DOMContentLoaded", function () {
        // Initialize the map
        initTheme();

        if (typeof L !== "undefined") {
          initMap();

          // Add click handler for the close navigation button
          document
            .querySelector(".close-nav")
            ?.addEventListener("click", resetView);

          // Add click handler for the route button
          document
            .querySelector(".route-btn")
            ?.addEventListener("click", findRoute);

          // Add click handler for the collapse directions button
          document
            .querySelector(".collapse-nav")
            ?.addEventListener("click", toggleNavCollapse);

          setupAddressAutocomplete("startAddress", "startSuggestions");
          setupAddressAutocomplete("endAddress", "endSuggestions");

          document
            .querySelector(".locate-btn")
            ?.addEventListener("click", useMyLocation);
          document
            .querySelector(".theme-btn")
            ?.addEventListener("click", toggleTheme);
          document
            .querySelector(".haven-btn")
            ?.addEventListener("click", goToNearestHaven);
          document
            .querySelector(".share-btn")
            ?.addEventListener("click", shareWalk);
          document
            .querySelector(".recenter-btn")
            ?.addEventListener("click", recenterOnUser);

          document.querySelectorAll(".when-chip").forEach((chip) => {
            chip.addEventListener("click", () => {
              const choice = chip.dataset.when;
              if (choice === "custom") {
                const custom = document.getElementById("customTime");
                if (custom) {
                  custom.hidden = false;
                  custom.focus();
                  setDeparture(custom.value || "22:00");
                }
                return;
              }
              setDeparture(choice);
            });
          });

          document
            .getElementById("customTime")
            ?.addEventListener("change", (event) => {
              if (event.target.value) setDeparture(event.target.value);
            });

          setDeparture("now");

          setTimeout(() => {
            showMessage(
              "Tell us where you are going, and when, and we will compare the ways there.",
              "info",
            );
          }, 1000);
        } else {
          console.error("Leaflet library failed to load");
          showMessage(
            "Error: Map functionality not available. Please try refreshing the page.",
            "error",
          );
        }
      });

      // Expose functions to the global scope for HTML event handlers
      window.findRoute = findRoute;
      window.resetView = resetView;
      function toggleNavCollapse() {
        const nav = document.querySelector(".navigation-panel");
        if (!nav) return;
        // The chevron itself is drawn in CSS and rotates off `.collapsed`.
        const isCollapsed = nav.classList.toggle("collapsed");
        document
          .querySelector(".collapse-nav")
          ?.setAttribute(
            "aria-label",
            isCollapsed ? "Expand directions" : "Collapse directions",
          );
      }
      window.toggleNavCollapse = toggleNavCollapse;
    </script>
  </body>
</html>
